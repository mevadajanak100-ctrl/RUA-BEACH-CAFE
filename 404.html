<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a1628">
    <title>Page not found | Rua Beach Cafe</title>
    <meta name="description" content="The requested Rua Beach Cafe page could not be found.">
    <link rel="icon" href="images/logo/rua-beach-cafe-logo.jpeg" type="image/jpeg">
    <style>
        :root {
            --bg: #0a1628;
            --surface: #0f2a3f;
            --accent: #00c8dd;
            --accent-soft: #9cecf3;
            --text: #f0f8ff;
            --muted: #c1d0d8;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; overflow-x: hidden; }
        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(0, 200, 221, 0.15), transparent 32%),
                radial-gradient(circle at bottom right, rgba(33, 143, 163, 0.14), transparent 28%),
                var(--bg);
            font: 16px/1.6 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        main {
            width: min(100%, 680px);
            padding: clamp(28px, 7vw, 72px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;
            background: linear-gradient(145deg, rgba(15, 42, 63, 0.96), rgba(10, 28, 45, 0.96));
            text-align: center;
            box-shadow: 0 28px 60px rgba(0, 10, 20, 0.42);
        }

        img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
        p { color: var(--muted); }
        h1 { margin: 18px 0 10px; font: 600 clamp(3rem, 12vw, 6rem)/0.9 Georgia, serif; }
        a {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 999px;
            color: var(--bg);
            background: linear-gradient(135deg, var(--accent), #218fa3);
            font-weight: 800;
            text-decoration: none;
        }

        a:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <img src="images/logo/rua-beach-cafe-logo.jpeg" alt="Rua Beach Cafe logo" width="72" height="72">
        <h1>Page not found.</h1>
        <p>That page moved or never existed. Return to Rua Beach Cafe and keep exploring.</p>
        <a href="index.html#home">Back to Rua Beach Cafe</a>
    </main>
</body>
</html>
